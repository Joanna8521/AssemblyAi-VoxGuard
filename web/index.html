<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EAE4DC; --surface:#F5F1EA; --surface-2:#E3DCD2; --surface-3:#D8CFC3;
  --ink:#302C26; --muted:#6B645A; --faint:#8B8276;
  --line:#D3CABE; --line-strong:#BAB0A2; --rail:#C6BCAE;
  --accent:#4B6364; --accent-soft:#DCE3E1;
  --clear:#4D6340; --clear-soft:#E0E5D6;
  --deny:#8D4A3F; --deny-soft:#F0DFDA;
  --caution:#7A5B16; --caution-soft:#F0E6D0;
  --on-accent:#F5F1EA;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#23201C; --surface:#2C2823; --surface-2:#332E27; --surface-3:#3B352C;
  --ink:#EBE4D9; --muted:#A9A093; --faint:#867D71;
  --line:#3B352C; --line-strong:#4D453A; --rail:#443D33;
  --accent:#93AAA8; --accent-soft:#2A3635;
  --clear:#9CB183; --clear-soft:#28301F;
  --deny:#CD9084; --deny-soft:#3A2823;
  --caution:#D0AC66; --caution-soft:#372E1C;
  --on-accent:#23201C;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1{font-size:17px;margin:0;letter-spacing:-.02em}
h2{font-size:13px;margin:0}
button{font:500 13px var(--sans);color:inherit;cursor:pointer;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.stop{background:var(--deny);border-color:var(--deny);color:#fff}
select{font:12.5px var(--sans);padding:7px 9px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:1280px;margin:0 auto;padding:16px 14px 60px}
@media(min-width:900px){.wrap{padding:24px 24px 80px}}

/* masthead */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.lamps{display:flex;flex-direction:column;gap:3px;padding:5px 4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px}
.lamps i{width:8px;height:8px;border-radius:50%;opacity:.25}
.lamps i:nth-child(1){background:var(--deny)}
.lamps i:nth-child(2){background:var(--caution)}
.lamps i:nth-child(3){background:var(--clear)}
.lamps i.on{opacity:1;box-shadow:0 0 8px currentColor}
.lamps i.on:nth-child(1){color:var(--deny)}
.lamps i.on:nth-child(2){color:var(--caution)}
.lamps i.on:nth-child(3){color:var(--clear)}
.sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{font:500 11px var(--mono);padding:4px 9px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.chip.live{border-color:var(--clear);color:var(--clear);background:var(--clear-soft)}
.chip.pol{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;margin-bottom:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.mic{display:inline-flex;align-items:center;gap:8px}
.mic .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.mic.on .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.spacer{flex:1}

/* two columns on desktop, stacked on phones */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:1000px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,400px);align-items:start}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.eyebrow{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.panel-bd{padding:13px}

/* ── the flow ── */
.flow{padding:16px 13px 20px;background:
  radial-gradient(circle at 1px 1px, var(--rail) 1px, transparent 0) 0 0/18px 18px;
  background-color:var(--surface)}
.node{
  position:relative;margin:0 auto;max-width:430px;
  border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);
  padding:9px 12px;display:flex;align-items:center;gap:10px;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.node .ico{font-size:17px;line-height:1;flex-shrink:0}
.node .body{flex:1;min-width:0}
.node .nm{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.node .meta{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .risk{font:600 9.5px var(--mono);padding:1.5px 5px;border-radius:2px;border:1px solid var(--line-strong);color:var(--faint);flex-shrink:0}
.node .risk.hi{border-color:var(--deny);color:var(--deny);background:var(--deny-soft)}
.node.pool{background:var(--surface-2);border-style:dashed}
.node.source,.node.sink{
  max-width:230px;padding:6px 12px;background:var(--surface-3);border-style:dashed;
  justify-content:center;font:11px var(--mono);color:var(--muted);
}
.node.busy{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.held{border-color:var(--deny);background:var(--deny-soft)}
.node.cleared{border-color:var(--clear)}

.edge{position:relative;margin:0 auto;width:2px;height:34px;background:var(--rail)}
.edge::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--rail)}
.edge .lbl{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  white-space:nowrap;font:10px var(--mono);color:var(--faint);
  background:var(--surface);padding:0 4px;border-radius:2px}
.edge .pkt{
  position:absolute;left:50%;top:0;transform:translate(-50%,-50%);
  padding:2px 7px;border-radius:9px;font:600 9.5px var(--mono);white-space:nowrap;
  border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
  animation:travel 1.1s ease-in-out forwards;
}
@keyframes travel{from{top:0;opacity:0}15%{opacity:1}85%{opacity:1}to{top:100%;opacity:0}}

/* the gate */
.gate{
  margin:0 auto;max-width:430px;border:1px solid var(--line-strong);border-radius:5px;
  background:var(--surface-2);padding:12px;text-align:center;
}
.gate .ttl{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.gate .sig{display:flex;gap:7px;justify-content:center;margin:9px 0 7px}
.gate .sig i{width:13px;height:13px;border-radius:50%;opacity:.18;transition:opacity .15s,box-shadow .15s}
.gate .sig i:nth-child(1){background:var(--clear)}
.gate .sig i:nth-child(2){background:var(--caution)}
.gate .sig i:nth-child(3){background:var(--deny)}
.gate.s-ALLOW .sig i:nth-child(1){opacity:1;box-shadow:0 0 13px var(--clear)}
.gate.s-ASK   .sig i:nth-child(2){opacity:1;box-shadow:0 0 13px var(--caution)}
.gate.s-DENY  .sig i:nth-child(3){opacity:1;box-shadow:0 0 13px var(--deny)}
.gate .cnt{font:11px var(--mono);color:var(--muted)}
.gate .cnt b{color:var(--ink)}
.gate .why{font-size:12px;line-height:1.5;color:var(--muted);margin-top:8px;min-height:1.5em}
.verdict-note{
  max-width:430px;margin:12px auto 0;padding:11px 13px;border-radius:5px;
  border:1px solid var(--line-strong);background:var(--surface);
  font-size:12.5px;line-height:1.55;display:none;
}
.verdict-note.show{display:block;animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict-note b{color:var(--ink)}
.verdict-note.good{border-color:var(--clear);background:var(--clear-soft)}
.verdict-note.hold{border-color:var(--caution);background:var(--caution-soft)}

.split{display:flex;gap:10px;max-width:430px;margin:0 auto}
.split>*{flex:1}

/* departments */
.deps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.deps button{padding:6px 11px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.deps button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* voice + policy + audit */
.said{font-size:15px;line-height:1.65;min-height:3.4em}
.said .partial{color:var(--muted)}
.agent{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.agent b{display:block;font:600 9.5px var(--mono);letter-spacing:.11em;color:var(--accent);margin-bottom:2px}
.rules{display:flex;flex-direction:column;gap:1px;font:11.5px var(--mono)}
.rule{display:flex;gap:8px;align-items:center;padding:5px 7px;background:var(--surface-2);border-radius:2px}
.rule .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule .cond{font-size:10px;color:var(--faint)}
.v{font:600 9.5px var(--mono);letter-spacing:.07em;padding:2px 5px;border-radius:2px}
.ALLOW{background:var(--clear-soft);color:var(--clear)}
.DENY{background:var(--deny-soft);color:var(--deny)}
.ASK{background:var(--caution-soft);color:var(--caution)}
.empty{font:11px var(--mono);color:var(--faint);text-align:center;padding:14px 4px;line-height:1.7}
.log{max-height:230px;overflow-y:auto;font:11px var(--mono)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ts{color:var(--faint);font-size:9.5px}
.lrow .ac{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .why{grid-column:1/-1;color:var(--faint);font:10.5px var(--sans);line-height:1.45}
.tag{font:600 9px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 4px;border-radius:2px;border:1px solid var(--line-strong);color:var(--faint)}
.tag.real{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.err{margin-top:10px;padding:8px 10px;border-radius:3px;background:var(--deny-soft);border:1px solid var(--deny);font-size:12.5px;display:none}
.err.show{display:block}
/* agent detail */
dialog{
  border:1px solid var(--line-strong);border-radius:6px;padding:0;
  background:var(--surface);color:var(--ink);max-width:560px;width:calc(100% - 24px);
  box-shadow:0 18px 50px -18px rgba(0,0,0,.4);
}
dialog::backdrop{background:rgba(16,26,23,.42)}
@media(max-width:620px){
  dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:10px 10px 0 0;border-bottom:0}
}
.d-hd{display:flex;align-items:flex-start;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.d-hd .ico{font-size:24px;line-height:1.1}
.d-hd h3{margin:0;font-size:16px;letter-spacing:-.02em}
.d-hd .dep{font:10.5px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.d-x{margin-left:auto;border:0;background:none;padding:4px 6px;font-size:17px;color:var(--muted);cursor:pointer}
.d-bd{padding:15px 16px;max-height:64vh;overflow-y:auto}
.d-purpose{font-size:14px;line-height:1.6;margin:0 0 14px}
.d-facts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.pill{font:11px var(--mono);padding:4px 9px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.d-sec{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.caps{display:flex;flex-direction:column;gap:1px}
.cap{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;padding:8px 9px;background:var(--surface-2);border-radius:3px}
.cap .a{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .a small{display:block;font:10.5px var(--sans);color:var(--faint);margin-top:1px}
.cap .why{grid-column:1/-1;font-size:11.5px;line-height:1.45;color:var(--faint)}
.d-ft{padding:11px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;line-height:1.5;color:var(--muted)}
.node.agent{cursor:pointer}
.node.agent:hover{border-color:var(--accent)}

.foot{margin-top:18px;padding:12px 14px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--muted)}
.foot code{font:11px var(--mono);background:var(--surface);padding:1px 4px;border-radius:2px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="lamps" id="lamps"><i></i><i></i><i></i></div>
      <div>
        <h1>Signal Box</h1>
        <p class="sub">Your workforce, running. And where it stops.</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip" id="c-conn">offline</span>
      <span class="chip pol" id="c-pol">no policy</span>
      <span class="chip" id="c-fp">none</span>
    </div>
  </header>

  <div class="bar">
    <button class="primary mic" id="talk"><span class="dot"></span><span id="talk-lbl">Talk to it</span></button>
    <button id="run">Run the stock-out</button>
    <button id="reset">Reset</button>
    <span class="spacer"></span>
    <select id="market" title="Platform names are configuration, not behaviour"></select>
    <span class="chip" id="c-corpus">loading</span>
  </div>

  <div class="grid">

    <div>
      <section class="panel">
        <div class="panel-hd">
          <span class="eyebrow">01</span><h2 id="flow-title">The floor</h2>
          <span class="chip" style="margin-left:auto" id="c-dept"></span>
        </div>
        <div class="panel-bd" style="padding-bottom:0">
          <div class="deps" id="deps"></div>
        </div>
        <div class="flow" id="flow"></div>
      </section>
    </div>

    <div class="side">

      <section class="panel">
        <div class="panel-hd"><span class="eyebrow">02</span><h2>Voice</h2>
          <span class="chip" style="margin-left:auto">Voice Agent API</span></div>
        <div class="panel-bd">
          <p class="said" id="said"><span class="empty" style="padding:0">Press talk, then say what this workforce may and may not do.</span></p>
          <div class="agent" id="agent" hidden><b>AGENT</b><span id="agent-text"></span></div>
          <div class="err" id="err"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd"><span class="eyebrow">03</span><h2>Policy in force</h2></div>
        <div class="panel-bd">
          <div class="rules" id="rules"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd"><span class="eyebrow">04</span><h2>Audit</h2>
          <span class="chip" style="margin-left:auto" id="c-audit">0</span></div>
        <div class="panel-bd"><div class="log" id="log"></div></div>
      </section>

    </div>
  </div>

  <div class="foot" id="foot"></div>

  <dialog id="detail">
    <div class="d-hd">
      <span class="ico" id="d-ico"></span>
      <div>
        <h3 id="d-name"></h3>
        <p class="dep" id="d-dep"></p>
      </div>
      <button class="d-x" id="d-close" aria-label="Close">&times;</button>
    </div>
    <div class="d-bd">
      <p class="d-purpose" id="d-purpose"></p>
      <div class="d-facts" id="d-facts"></div>
      <p class="d-sec">What it may do, right now</p>
      <div class="caps" id="d-caps"></div>
    </div>
    <p class="d-ft" id="d-ft"></p>
  </dialog>
</div>

<script type="module">
import { connect } from './voice.js';
import { registerWebMCP } from './webmcp.js';

const $ = (id) => document.getElementById(id);
const api = (p, body) => fetch(p, body
  ? { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }
  : undefined).then(async (r) => {
    const d = await r.json().catch(() => ({ error:`${r.status}` }));
    if (!r.ok) throw new Error(d.error ?? r.status);
    return d;
  });

let WF = null, DEPT = null, VOICE = null;

// ── the flow ────────────────────────────────────────────────────────────────
// A vertical run of nodes with labelled edges, the same shape on a phone and on
// a desktop. Everything consequential passes through one node in the middle,
// which is the only claim this picture is really making.

function nodeEl(kind, ico, name, meta, risk) {
  const d = document.createElement('div');
  d.className = `node ${kind}`;
  if (kind === 'source' || kind === 'sink') { d.textContent = name; return d; }
  d.innerHTML =
    `<span class="ico">${ico}</span>` +
    `<span class="body"><span class="nm">${name}</span>` +
    (meta ? `<span class="meta">${meta}</span>` : '') + `</span>` +
    (risk ? `<span class="risk${risk.startsWith('L4') ? ' hi' : ''}">${risk}</span>` : '');
  return d;
}

function edgeEl(label) {
  const d = document.createElement('div');
  d.className = 'edge';
  if (label) d.innerHTML = `<span class="lbl">${label}</span>`;
  return d;
}

function gateEl() {
  const d = document.createElement('div');
  d.className = 'gate';
  d.id = 'gate';
  d.innerHTML =
    `<p class="ttl">Policy evaluator</p>` +
    `<div class="sig"><i></i><i></i><i></i></div>` +
    `<p class="cnt"><b id="g-pass">0</b> cleared &middot; <b id="g-hold">0</b> held</p>` +
    `<p class="why" id="g-why"></p>`;
  return d;
}

function renderDept(id) {
  DEPT = id;
  const dept = WF.departments.find((d) => d.id === id);
  const agents = WF.agents.filter((a) => a.department === id);
  const pools = new Set(agents.flatMap((a) => a.writes));

  $('flow-title').textContent = `${dept.emoji} \u00a0${dept.name}`;
  $('c-dept').textContent = `${agents.length} agents`;
  for (const b of $('deps').children) b.setAttribute('aria-pressed', b.dataset.id === id);

  const flow = $('flow');
  flow.innerHTML = '';
  flow.appendChild(nodeEl('source', '', 'Schedules, signals, and you', ''));
  flow.appendChild(edgeEl('wake the agent'));

  for (const a of agents) {
    const when = a.schedule ?? (a.triggered_by ? `on ${a.triggered_by.join(' / ')}` : 'on demand');
    const el = nodeEl('agent', a.emoji, a.name, `${when}  &middot;  ${a.actions.length} actions`, a.highestRisk);
    el.id = `n-${a.id}`;
    el.title = a.purpose;
    el.onclick = () => openAgent(a.id);
    flow.appendChild(el);
    flow.appendChild(edgeEl(''));
  }

  if (pools.size) {
    const wrap = document.createElement('div');
    wrap.className = 'split';
    for (const p of [...pools].slice(0, 3)) {
      const pool = WF.pools.find((x) => x.id === p);
      const el = nodeEl('pool', pool.emoji, pool.name, '');
      el.style.maxWidth = 'none';
      wrap.appendChild(el);
    }
    flow.appendChild(wrap);
    flow.appendChild(edgeEl('anything consequential'));
  }

  flow.appendChild(gateEl());
  flow.appendChild(edgeEl('cleared only'));
  flow.appendChild(nodeEl('sink', '', 'The outside world', ''));

  const note = document.createElement('div');
  note.className = 'verdict-note';
  note.id = 'run-note';
  flow.appendChild(note);
}

/**
 * An agent, opened.
 *
 * The list of what it *can* do is static and not very interesting. What it may
 * do right now, under the policy currently in force, is the question only a
 * governance layer can answer, so that is what this leads with. The verdicts
 * come from the same evaluator that decides for real; the difference is that
 * asking does not count as doing, so nothing lands in the audit.
 */
let OPEN_AGENT = null;

async function openAgent(id) {
  const a = WF.agents.find((x) => x.id === id);
  if (!a) return;
  OPEN_AGENT = id;

  const dept = WF.departments.find((d) => d.id === a.department);
  const poolName = (p) => {
    const pool = WF.pools.find((x) => x.id === p);
    return pool ? `${pool.emoji} ${pool.name}` : p;
  };

  $('d-ico').textContent = a.emoji;
  $('d-name').textContent = a.name;
  $('d-dep').textContent = `${a.id} \u00b7 ${dept.emoji} ${dept.name}`;
  $('d-purpose').textContent = a.purpose;

  const facts = [
    ['Runs', a.schedule ?? (a.triggered_by ? `when ${a.triggered_by.join(' or ')} raises a signal` : 'on demand')],
    ['Reads', a.reads.length ? a.reads.map(poolName).join(', ') : 'nothing'],
    ['Writes', a.writes.length ? a.writes.map(poolName).join(', ') : 'nothing'],
  ];
  $('d-facts').innerHTML = facts
    .map(([k, v]) => `<span class="pill">${k} <b>${v}</b></span>`).join('');

  $('d-caps').innerHTML = '<p class="empty">Asking the evaluator...</p>';
  $('detail').showModal();

  const { policyVersion, results } = await api('/api/preview', { skill: id, actions: a.actions });
  if (OPEN_AGENT !== id) return;

  $('d-caps').innerHTML = '';
  for (const r of results) {
    const d = document.createElement('div');
    d.className = 'cap';
    d.innerHTML =
      `<span class="a">${r.action}<small>${r.label}</small></span>` +
      `<span class="tag ${r.real ? 'real' : ''}">${r.real ? 'real' : 'sandbox'}</span>` +
      `<span class="v ${r.verdict}">${r.verdict}</span>` +
      `<span class="why">${r.risk} &middot; ${r.reason}</span>`;
    $('d-caps').appendChild(d);
  }

  const held = results.filter((r) => r.verdict !== 'ALLOW').length;
  $('d-ft').textContent = policyVersion
    ? `Judged against policy version ${policyVersion}. ${held} of ${results.length} would not go through as things stand. Change the policy by voice and reopen this to see it move.`
    : `No policy has been compiled, so nothing consequential is assumed. ${held} of ${results.length} would stop here. Speak a policy and reopen this.`;
}

// ── live state ──────────────────────────────────────────────────────────────
let passed = 0, held = 0;

function signal(verdict, why) {
  const g = $('gate');
  if (!g) return;
  g.className = `gate s-${verdict}`;
  $('g-why').textContent = why ?? '';
  const lamps = $('lamps').children;
  for (const l of lamps) l.className = '';
  lamps[verdict === 'DENY' ? 0 : verdict === 'ASK' ? 1 : 2].className = 'on';
  setTimeout(() => { g.className = 'gate'; }, 2600);
}

function packet(agentId, text, verdict) {
  const node = $(`n-${agentId}`);
  if (node) {
    node.classList.add('busy');
    setTimeout(() => {
      node.classList.remove('busy');
      node.classList.add(verdict === 'ALLOW' ? 'cleared' : 'held');
      setTimeout(() => node.classList.remove('cleared', 'held'), 2200);
    }, 700);
  }
  const edges = [...document.querySelectorAll('.edge')];
  const edge = edges.at(-2);
  if (!edge) return;
  const p = document.createElement('span');
  p.className = 'pkt';
  p.textContent = text;
  edge.appendChild(p);
  setTimeout(() => p.remove(), 1200);
}

function renderPolicy(policy, fp) {
  const box = $('rules');
  if (!policy) {
    box.innerHTML = '<p class="empty">Nothing authorised yet<br>Nothing consequential is assumed</p>';
    $('c-pol').textContent = 'no policy';
    $('c-fp').textContent = 'none';
    return;
  }
  box.innerHTML = '';
  for (const r of policy.rules) {
    const d = document.createElement('div');
    d.className = 'rule';
    d.innerHTML = `<span class="nm">${r.action}</span>` +
      (r.conditions ? `<span class="cond">${Object.entries(r.conditions)
        .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ')}</span>` : '') +
      `<span class="v ${r.effect}">${r.effect}</span>`;
    box.appendChild(d);
  }
  $('c-pol').textContent = `${policy.policyId} v${policy.version}`;
  $('c-fp').textContent = fp ?? 'none';
}

function renderAudit(entries) {
  const box = $('log');
  $('c-audit').textContent = entries.length;
  if (!entries.length) { box.innerHTML = '<p class="empty">No decisions yet</p>'; return; }
  box.innerHTML = '';
  for (const e of entries.slice(-40)) {
    const d = document.createElement('div');
    d.className = 'lrow';
    d.innerHTML =
      `<span class="ts">${e.at.slice(11, 19)}</span>` +
      `<span class="ac">${e.action}</span>` +
      `<span><span class="tag ${e.real ? 'real' : ''}">${e.real ? 'real' : 'sandbox'}</span> ` +
      `<span class="v ${e.verdict}">${e.verdict}</span></span>` +
      `<span class="why">${e.reason}</span>`;
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}

async function refresh() {
  const s = await api('/api/state');
  renderPolicy(s.policy, s.fingerprint);
  renderAudit(s.audit);
  passed = s.audit.filter((e) => e.verdict === 'ALLOW').length;
  held = s.audit.length - passed;
  if ($('g-pass')) { $('g-pass').textContent = passed; $('g-hold').textContent = held; }
}

// ── firing actions at the evaluator ─────────────────────────────────────────
async function fire(agentId, action, parameters = {}) {
  const r = await api('/api/evaluate', { skill: agentId, action, parameters });
  packet(agentId, action, r.verdict);
  signal(r.verdict, `${action}: ${r.reason}`);
  await refresh();
  return r;
}

/**
 * The stock-out. A signal wakes Emergency Response, which fans out; the
 * Scheduler then tries to arrange the one thing that was refused. Every verdict
 * comes from the server, so nothing here is staged: with no policy compiled the
 * whole run stops, which is the correct and rather undramatic answer.
 */
async function runMission() {
  $('run').disabled = true;
  const script = [
    ['A03', 'pause_ad', { platform: 'meta' }],
    ['A03', 'delist_product', { platform: 'shopee' }],
    ['A03', 'mark_out_of_stock', {}],
    ['A04', 'read_orders', { }],
    ['A23', 'notify_customer', { customer_group: 'all' }],
    ['A04', 'issue_refund', { count: 14 }],
    ['A36', 'create_schedule', { action: 'notify_customer' }],
  ];
  const outcomes = [];
  for (const [agent, action, params] of script) {
    const dept = WF.agents.find((a) => a.id === agent)?.department;
    if (dept && dept !== DEPT) renderDept(dept);
    outcomes.push(await fire(agent, action, params));
    await new Promise((r) => setTimeout(r, 1150));
  }
  $('run').disabled = false;

  // A bare counter reading "1 cleared, 6 held" looks like the run broke. It did
  // not: holding is the whole product. Say which it is, and what to do next.
  const cleared = outcomes.filter((o) => o.verdict === 'ALLOW');
  const stopped = outcomes.filter((o) => o.verdict !== 'ALLOW');
  const s = await api('/api/state');
  const note = $('run-note');
  if (!note) return;

  if (!s.policy) {
    note.className = 'verdict-note hold show';
    note.innerHTML =
      `<b>The run finished.</b> ${cleared.length} of ${outcomes.length} actions went through; ` +
      `the other ${stopped.length} stopped at the evaluator because <b>nothing has been ` +
      `authorised yet</b>. That is the system working, not failing: a workforce nobody has ` +
      `spoken to does not get to touch the outside world.<br><br>` +
      `Press <b>Talk to it</b>, say what it may and may not do, then run this again.`;
  } else {
    const named = stopped.map((o) => o.request.action);
    note.className = `verdict-note ${stopped.length ? 'hold' : 'good'} show`;
    note.innerHTML = stopped.length
      ? `<b>The run finished under ${s.policy.policyId} v${s.policy.version}.</b> ` +
        `${cleared.length} cleared. ${stopped.length} held: <b>${named.join(', ')}</b>. ` +
        `Every one of those was refused because of something you said, and the audit below ` +
        `records which rule and which version.`
      : `<b>The run finished under ${s.policy.policyId} v${s.policy.version}.</b> ` +
        `All ${cleared.length} actions cleared, because the policy covers all of them.`;
  }
}

// ── voice ───────────────────────────────────────────────────────────────────
function setConn(text, live) {
  $('c-conn').textContent = text;
  $('c-conn').className = `chip${live ? ' live' : ''}`;
}

async function talk() {
  if (VOICE) { VOICE.stop(); return; }
  $('err').classList.remove('show');
  $('talk').disabled = true;

  try {
    VOICE = await connect({
      onStatus: (s) => {
        setConn(s, s === 'live');
        $('talk').disabled = false;
        $('talk').className = s === 'live' ? 'stop mic on' : 'primary mic';
        $('talk-lbl').textContent = s === 'live' ? 'Stop' : 'Talk to it';
        if (s === 'offline') VOICE = null;
      },
      onUser: (text, final) => {
        $('said').innerHTML = final ? '' : '<span class="partial"></span>';
        (final ? $('said') : $('said').firstChild).textContent = text;
      },
      onAgent: (text) => { $('agent').hidden = false; $('agent-text').textContent = text; },
      onTool: refresh,
      onError: (m) => { $('err').textContent = m; $('err').classList.add('show'); },
    });
  } catch (e) {
    $('err').textContent = e.message;
    $('err').classList.add('show');
    $('talk').disabled = false;
    VOICE = null;
  }
}

// ── boot ────────────────────────────────────────────────────────────────────
(async () => {
  const [health, wf, catalog] = await Promise.all([
    api('/api/health'), api('/api/workforce'), api('/api/actions'),
  ]);
  WF = wf;

  // Offer this page to whatever agent is in the browser. Feature-detected, so
  // it is a no-op where the API has not shipped.
  const governed = catalog.actions
    .filter((a) => a.risk.startsWith('L3') || a.risk.startsWith('L4'))
    .map((a) => a.id);
  const webmcp = registerWebMCP(governed);

  // An agent acting through WebMCP is not clicking anything, so the page would
  // otherwise sit still while decisions land. Keep it honest.
  addEventListener('signalbox:decision', (e) => {
    signal(e.detail.verdict, `${e.detail.request.action}: ${e.detail.reason}`);
    refresh();
  });

  const c = health.corpus;
  $('c-corpus').innerHTML = `<b>${wf.agents.length}</b> agents &middot; <b>${wf.departments.length}</b> departments`;

  $('market').innerHTML = Object.keys(wf.platforms.presets)
    .map((k) => `<option value="${k}">${k}</option>`).join('');
  $('market').value = wf.platforms.default;

  $('deps').innerHTML = '';
  for (const d of wf.departments) {
    const b = document.createElement('button');
    b.dataset.id = d.id;
    b.textContent = `${d.emoji}\u00a0 ${d.name}`;
    b.onclick = () => renderDept(d.id);
    $('deps').appendChild(b);
  }
  renderDept('ops');

  if (!health.keyConfigured) {
    setConn('no API key', false);
    $('talk').disabled = true;
  }

  $('d-close').onclick = () => $('detail').close();
  $('detail').addEventListener('close', () => { OPEN_AGENT = null; });
  // Clicking the backdrop should dismiss, the way a sheet does on a phone.
  $('detail').addEventListener('click', (e) => {
    if (e.target === $('detail')) $('detail').close();
  });

  $('talk').onclick = talk;
  $('run').onclick = runMission;
  $('reset').onclick = async () => {
    await api('/api/reset', {});
    $('said').textContent = '';
    $('agent').hidden = true;
    await refresh();
  };

  $('foot').innerHTML =
    `Every node here comes from <code>agents/workforce.json</code>, and every verdict from the ` +
    `evaluator on the server. Nothing on this page is staged: with no policy compiled, a run of ` +
    `the stock-out stops almost immediately, which is the correct answer and not a very ` +
    `dramatic one. Actions marked <code>sandbox</code> have no credential anywhere and are ` +
    `simulated; <code>real</code> ones are not. The evaluator is real either way.` +
    `<br><br>` + (webmcp
      ? `This page is registered with the browser through <code>navigator.modelContext</code>: ` +
        `an agent in this tab can read the policy and attempt actions, and meets the same ` +
        `evaluator you do. There is no faster path for being in the same window.`
      : `An MCP server for external agents lives at <code>mcp/server.js</code>. This browser ` +
        `has no <code>navigator.modelContext</code>, so the in-page equivalent is dormant here.`);

  await refresh();
})();
</script>
